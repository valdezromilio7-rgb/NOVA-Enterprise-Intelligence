name: NOVA Factory Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run factory tests
        run: python -m unittest discover -s tests/factory -p "test_*.py" -v
      - name: Run evaluation tests
        run: python -m unittest discover -s tests/evaluation -p "test_*.py" -v
